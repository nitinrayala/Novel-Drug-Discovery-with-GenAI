[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tcams-joint-predictor"
version = "0.1.0"
description = "Leakage-controlled joint Dd2/HepG2 prediction from TCAMS"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "torch", "rdkit", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["tcams*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
